name: Build and Release
on:
  push:
    branches: [ main ]
jobs:
  bump-version:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump-version.outputs.new_version }}
      commit_sha: ${{ steps.bump-version.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ github.token }}

      - name: Bump version
        id: bump-version
        run: |
          $current_version = (Get-Content Cargo.toml | Select-String -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Matches.Groups[1].Value
          $version_parts = $current_version -split '\.'
          $new_minor = [int]$version_parts[1] + 1
          $new_version = "$($version_parts[0]).$new_minor.$($version_parts[2])"
          Write-Host "Bumping version to $new_version"
          (Get-Content Cargo.toml) -replace "^version = `"$current_version`"", "version = `"$new_version`"" | Set-Content Cargo.toml
          $lockPattern = '(?m)(^\[\[package\]\]\r?\nname = "randolf"\r?\nversion = ")[^"]+("\r?$)'
          $lockRegex = [regex]::new($lockPattern)
          $lockContents = Get-Content Cargo.lock -Raw
          if ($lockRegex.Matches($lockContents).Count -ne 1) {
            throw "Expected exactly one Randolf package entry in Cargo.lock"
          }
          $lockContents = $lockRegex.Replace($lockContents, { param($match) "$($match.Groups[1].Value)$new_version$($match.Groups[2].Value)" }, 1)
          Set-Content Cargo.lock -Value $lockContents -NoNewline
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to $new_version"
          git push origin HEAD:main
          Write-Host "Pushed new version to main branch"
          echo "new_version=$new_version" >> $env:GITHUB_OUTPUT
          echo "commit_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

  build:
    needs: bump-version
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_EXECUTABLE: ./target/release/randolf.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Store unsigned executable
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-randolf
          path: ${{ env.RELEASE_EXECUTABLE }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: windows-latest
    permissions: {}
    env:
      RELEASE_EXECUTABLE: ./unsigned/randolf.exe

    steps:
      - name: Retrieve unsigned executable
        uses: actions/download-artifact@v8
        with:
          name: unsigned-randolf
          path: ./unsigned

      - name: Decode certificate
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

      - name: Sign binary
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $signtoolPath = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtoolPath sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 /fd SHA256 $env:RELEASE_EXECUTABLE
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Signing failed with exit code $LASTEXITCODE"
            exit 1
          }
          Write-Host "Checking signature..."
          $signature = Get-AuthenticodeSignature $env:RELEASE_EXECUTABLE
          if ($signature.Status -eq "Valid") {
            Write-Host "Binary successfully signed."
          } elseif ($signature.Status -eq "UnknownError") {
            Write-Host "Binary either successfully signed using self-signed certificate or signing process failed (see below)."
            Write-Host "Status message: $($signature.StatusMessage)"
          } else {
            Write-Host "Signature verification failed because: $($signature.StatusMessage)"
            exit 1
          }

      - name: Remove certificate
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "cert.pfx") -Force -ErrorAction SilentlyContinue

      - name: Store signed executable
        uses: actions/upload-artifact@v7
        with:
          name: signed-randolf
          path: ${{ env.RELEASE_EXECUTABLE }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [bump-version, sign]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_EXECUTABLE: ./signed/randolf.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ github.token }}

      - name: Retrieve signed executable
        uses: actions/download-artifact@v8
        with:
          name: signed-randolf
          path: ./signed

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.bump-version.outputs.new_version }}"
          $assetPath = Join-Path $env:RUNNER_TEMP "randolf-v$version.exe"
          $targetCommit = "${{ needs.bump-version.outputs.commit_sha }}"
          Copy-Item $env:RELEASE_EXECUTABLE $assetPath
          gh release create "v$version" $assetPath --target $targetCommit --title "Release v$version" --notes ""
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Update Scoop manifest
        run: |
          $version = "${{ needs.bump-version.outputs.new_version }}"
          $executableName = Split-Path $env:RELEASE_EXECUTABLE -Leaf
          $assetName = "randolf-v$version.exe"
          $hash = (Get-FileHash $env:RELEASE_EXECUTABLE -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content randolf.json -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.url = "https://github.com/${{ github.repository }}/releases/download/v$version/$assetName#/$executableName"
          $manifest.hash = "sha256:$hash"
          $manifest.bin = $executableName
          $manifest.autoupdate.url = "https://github.com/${{ github.repository }}/releases/download/v`$version/randolf-v`$version.exe#/$executableName"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content randolf.json -Encoding utf8
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add randolf.json
          git commit -m "Update Scoop manifest to $version"
          git push origin HEAD:main
